<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密碼 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
        h1 { color: #0F2443; border-bottom: 3px solid #14B8A6; padding-bottom: 10px; }
        .field { margin: 16px 0; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #14B8A6; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0D9488; }
        .error { background: #FEE2E2; color: #991B1B; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .success { background: #D1FAE5; color: #065F46; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>修改密碼</h1>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${message}" class="success" th:text="${message}"></div>

    <form th:action="@{/password}" method="post">
        <div class="field">
            <label>舊密碼</label>
            <input type="password" name="oldPassword" required>
        </div>
        <div class="field">
            <label>新密碼</label>
            <input type="password" name="newPassword" required placeholder="至少 8 碼">
        </div>
        <div class="field">
            <label>確認新密碼</label>
            <input type="password" name="confirmPassword" required>
        </div>
        <button type="submit">確認修改</button>
    </form>
    <p style="margin-top: 20px;"><a th:href="@{/}">返回首頁</a></p>
</body>
</html>

# 設定 SQLite 存儲於實體檔案 miniclinic.db，而不是記憶體
spring.datasource.url=jdbc:sqlite:miniclinic.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# 設定 Hibernate 自動更新資料表結構（不要每次都 create-drop）
spring.jpa.hibernate.ddl-auto=update

# 顯示執行的 SQL 指令（方便排錯）
spring.jpa.show-sql=true

# 每次啟動仍執行 data.sql（配合 INSERT OR IGNORE 使用）
spring.sql.init.mode=always

# 關鍵：確保 Hibernate 建立表結構後，才執行 data.sql 初始化資料
spring.jpa.defer-datasource-initialization=true

# 強制使用 UTF-8 讀取 SQL 初始化檔案（解決 data.sql 亂碼）
spring.sql.init.encoding=UTF-8

# 強制 Web 請求與回應使用 UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
